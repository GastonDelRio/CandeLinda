     body {
      margin: 0;

      text-align: center;
      background: url("imagenes/fondo1.jpg") no-repeat center center/cover;
      color: white;

      display: flex;

    }
    .btn {
      padding: 12px 24px;
      font-size: 18px;
      border: none;
      border-radius: 8px;

      margin-top: 20px;

<body>
  <!-- 🎶 Música de fondo -->
  <audio id="player" autoplay loop>
    <source src="musica/Fade To Black (Remastered).mp3" type="audio/mpeg">
    Tu navegador no soporta audio.
  </audio>

  <div>
    <label for="volumen">🔊 Volumen:</label><br>
    <input type="range" id="volumen" min="0" max="1" step="0.01" value="1">
  </div>

  <script>
    const player = document.getElementById("player");
    const volumen = document.getElementById("volumen");

    volumen.addEventListener("input", () => {
      player.volume = volumen.value;
    });
  </script>
