  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;
    }

    /* Fondo borroso */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('imagenes/fondo1.jpg') no-repeat center center/cover;
      filter: blur(8px);
      z-index: -1;
    }

    h1 {
      margin-top: 20px;
      font-size: 2.5em;
      color: #87CEFA; /* azul clarito */
      text-shadow: 2px 2px 5px black;
    }

    .album {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
      padding: 20px;
      max-width: 1200px;
      margin: auto;
    }

    .album img {
      width: 100%;
      border-radius: 15px;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.6);
      transition: transform 0.3s ease;
    }

    .album img:hover {
      transform: scale(1.05);
    }

    /* Foto con texto al lado */
    .foto-texto {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      background: rgba(0, 0, 0, 0.5);
      padding: 15px;
      border-radius: 15px;
    }

    .foto-texto img {
      width: 50%;
      border-radius: 10px;
    }

    .foto-texto p {
      font-size: 1.2em;
      font-style: italic;
      color: #fff;
    }

    .botones {
      margin: 30px;
    }

    .btn {
      text-decoration: none;
      background-color: #1E90FF; /* azul */
      color: white;
      padding: 12px 20px;
      border-radius: 25px;
      margin: 10px;
      transition: 0.3s ease;
      font-weight: bold;
    }

    .btn:hover {
      background-color: #4682B4; /* azul más oscuro */
    }
  </style>
</head>
